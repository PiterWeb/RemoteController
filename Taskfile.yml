version: "3"

tasks:
  dev-all:
    deps: [dev-front, dev-back]
    desc: Run the application in development mode
  dev-front:
    dir: frontend
    deps: [install-front]
    cmds:
      - pnpm run dev
    desc: Run the frontend in development mode
  dev-back:
    watch: true
    sources: 
      - 'main.go'
      - 'src/**/**.go'
    env:
       LRP_DEV: true
    cmds:
      - go build .
      - ./LibreRemotePlay
    desc: Run the backend in development mode 
  build:
    deps: [build-front]
    cmds:
      - go build .
    desc: Build the application for all platforms
  build-linux-flatpak:
    deps: [build-front]
    cmds:
      - flatpak-builder --force-clean --user --install-deps-from=flathub --repo=repo --install builddir packaging/flatpak/io.github.PiterWeb.LibreRemotePlay.yml
  build-linux-appimage:
    deps: [build-linux, install-linuxdeploy]
    # env:
    #   NO_STRIP: true
    cmds:
      - ./linuxdeploy-x86_64.AppImage --appdir AppDir --desktop-file assets/LibreRemotePlay.desktop --executable build/bin/LibreRemotePlay --plugin gtk -i assets/remotecontroller.png -d assets/LibreRemotePlay.desktop --output appimage
    desc: (Experimental) Build AppImage for Linux based on previously generated binaries (wget required)
  build-wasm-front:
    dir: frontend/static/wasm
    env:
      GOOS: js
      GOARCH: wasm
    cmds:
      - go build -o signal.wasm
    desc: Build the frontend wasm
    sources:
      - signal.wasm
  test:
    desc: Run E2E tests
    dir: frontend
    deps: [dev-all]
    cmds:
      - pnpm run test
  install-front:
    dir: frontend
    cmds:
      - pnpm install
    sources:
      - package.json
    status:
      - test -d node_modules
  install-linuxdeploy:
    cmds:
      - wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
      - chmod +x linuxdeploy-x86_64.AppImage
      - wget -c "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh"
      - chmod +x linuxdeploy-plugin-gtk.sh
    sources:
      - linuxdeploy-x86_64.AppImage
      - linuxdeploy-plugin-gtk.sh
  build-front:
    deps: [install-front, build-wasm-front]
    dir: frontend
    cmds:
      - pnpm run build
    sources:
      - src/**/*.css
      - src/**/*.js
      - src/**/*.ts
      - src/**/*.svelte
      - src/**/*.json
      - vite.config.ts
      - svelte.config.js
      - tailwind.config.js
      - package.json
    desc: Build the frontend
